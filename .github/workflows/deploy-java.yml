name: Generic Java Deployment

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
    secrets:
      SSH_CONFIG_JSON:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Backend
        run: |
          mvn -B -q clean package
        working-directory: ./

      - name: Set variables
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-5)
          TIMESTAMP=$(date +'%Y%m%d')
          echo "BACKEND_VERSION=$TIMESTAMP.$SHORT_SHA.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "TARGET_DIR=/home/backend/${{ inputs.service_name }}" >> $GITHUB_OUTPUT

      - name: Copy files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ fromJSON(secrets.SSH_CONFIG_JSON).host }}
          port: ${{ fromJSON(secrets.SSH_CONFIG_JSON).port }}
          username: ${{ fromJSON(secrets.SSH_CONFIG_JSON).user }}
          key: ${{ fromJSON(secrets.SSH_CONFIG_JSON).key }}
          source: "target/${{ inputs.service_name }}-*.jar,docker/*"
          target: "${{ steps.vars.outputs.TARGET_DIR }}"
          strip_components: 1

      - name: Create and start container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ fromJSON(secrets.SSH_CONFIG_JSON).host }}
          port: ${{ fromJSON(secrets.SSH_CONFIG_JSON).port }}
          username: ${{ fromJSON(secrets.SSH_CONFIG_JSON).user }}
          key: ${{ fromJSON(secrets.SSH_CONFIG_JSON).key }}
          script: |
            cd "${{ steps.vars.outputs.TARGET_DIR }}"
            sed -i "s/BACKEND_VERSION=.*/BACKEND_VERSION=${{ steps.vars.outputs.BACKEND_VERSION }}/" .env
            docker-compose down
            docker-compose up -d --build